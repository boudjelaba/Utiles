<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte météo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap" rel="stylesheet">
  <!-- <link rel="stylesheet" href="style.css"> -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4em;
      font-weight: 500;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .search-container {
      display: flex;
      width: 100%;
      max-width: 360px;
      gap: 8px;
    }

    #city-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: white;
      font-size: 1em;
    }

    #city-input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    #search-btn {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    #search-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .weather-card {
      margin-top: 20px;
      width: 100%;
      max-width: 380px;
      padding: 24px 24px 30px 24px;
      border-radius: 30px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    #city-name {
      font-size: 2em;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    #time {
      font-size: 1em;
      opacity: 0.9;
      margin-top: 4px;
    }

    #weather-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 25px 0 10px 0;
    }

    #weather-icon {
      width: 120px;
      height: 120px;
    }

    #temp {
      font-size: 4.6em;
      font-weight: 300;
      text-align: right;
      margin: 0;
    }

    #weather-description {
      font-size: 1.1em;
      text-align: right;
      margin-top: -5px;
    }

    #windspeed {
      font-size: 0.9em;
      opacity: 0.85;
    }

    #forecast {
      margin-top: 25px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.3);
    }

    .forecast-day {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px;
      font-size: 1em;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .forecast-day:last-child {
      border-bottom: none;
    }

    .forecast-day img {
      width: 40px;
      height: 40px;
    }

    .forecast-temp {
      display: flex;
      gap: 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>

  <h1>Carte météo</h1>

  <div class="search-container">
    <input type="text" id="city-input" placeholder="Rechercher une ville">
    <button id="search-btn">OK</button>
  </div>

  <!-- Carte météo -->
  <div class="weather-card" role="region" aria-label="Informations météo">

    <!-- Nom de la ville et heure locale -->
    <h1 id="city-name" style="font-size:1.6em; font-weight:600;"></h1>
    <div id="time" style="margin-top:4px;"></div>

    <!-- Météo actuelle -->
    <div id="weather-main" role="status" aria-live="polite">
      <img id="weather-icon" src="" alt="icone météo">
      <div>
        <div id="temp" style="font-size:2em; font-weight:600;"></div>
        <div id="weather-description" style="margin-top:4px;"></div>
        <div id="wind" style="margin-top:2px; font-size:0.9em;"></div>
      </div>
    </div>

    <!-- Prévisions 4 jours -->
    <div id="forecast"></div>

  </div>

  <script src="meteo.js"></script>
  
</body>
</html>
